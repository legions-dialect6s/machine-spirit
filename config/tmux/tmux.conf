# ~/.tmux.conf — machine-spirit
# ─────────────────────────────────────────────────────────────────────────────
# This file exists for ONE reason: make a tmux-server death survivable. Sessions
# live only in the server's memory, so when the server dies (crash, OOM, a
# `banish all`), every session dies with it — unrecoverable unless its layout was
# saved to disk first. tmux-resurrect saves/restores that layout to disk;
# tmux-continuum auto-saves it on a timer. Both are surfaced in sheol
# (💾 save · ♻ restore) and via bin/sheol-core (save | restore).
#
# Everything else about a session (the  ⛧ tmux ⛧  status-right badge) is still
# set inline per-session by bin/tmux-session.sh — this file stays deliberately
# tiny so it can't surprise an existing workflow.
#
# Plugins are cloned by install.sh to ~/.tmux/plugins (no plugin manager, sourced
# directly). Pinned:
#   tmux-resurrect  @ cff343cf9e81983d3da0c8562b01616f12e8d548
#   tmux-continuum  @ 0698e8f4b17d6454c71bf5212895ec055c578da0

# --- tmux-resurrect: save/restore the session layout under ~/.tmux/resurrect/ ---
# capture-pane-contents keeps each pane's scrollback in the snapshot, so a
# restored spirit shows what it was doing, not a blank shell. (Restoring *running
# programs* is left at resurrect's conservative default — shells/editors only —
# so a restore never silently re-launches a heavy process.)
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# --- tmux-continuum: auto-save the whole server every 15 min ---
# So a crash / OOM / `banish all` is always recoverable from a recent snapshot.
# restore is OFF: no surprise resurrection on server start — you bring spirits
# back deliberately from sheol (♻) once you've decided to.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
